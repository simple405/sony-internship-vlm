# Atomic rules batch defaults for the Safebooru pilot.
#
# This file is a human-readable run contract. The QA harness currently uses CLI
# arguments only, so these values are mirrored in the command examples below.

dataset: vlm/data/safebooru_2d/japanese_anime_turnaround_pilot_20
metadata: vlm/data/safebooru_2d/japanese_anime_turnaround_pilot_20/metadata.jsonl
atomic_dir: vlm/data/safebooru_2d/japanese_anime_turnaround_pilot_20/atomic_rules
report_dir: vlm/data/safebooru_2d/japanese_anime_turnaround_pilot_20/reports

qwen:
  model: qwen3.5-plus
  workers: 4
  sleep: 0.5
  retries: 2
  retry_base_sleep: 2.0
  image_source: url

qa:
  min_rules: 6
  max_rules: 60
  review_columns:
    - sample_id
    - json_valid
    - core_features_complete
    - too_fragmented
    - wrong_category
    - value_normalized
    - usable
    - notes

commands:
  extract_watch: >-
    .\.venv\Scripts\python.exe .\vlm\scripts\extract_atomic_rules_with_qwen.py
    --metadata .\vlm\data\safebooru_2d\japanese_anime_turnaround_pilot_20\metadata.jsonl
    --out-dir .\vlm\data\safebooru_2d\japanese_anime_turnaround_pilot_20\atomic_rules
    --model qwen3.5-plus --offset 0 --limit 0 --image-source url
    --workers 4 --sleep 0.5 --retries 2 --watch --poll-interval 10
  qa: >-
    .\.venv\Scripts\python.exe .\vlm\scripts\qa_atomic_rules_batch.py
    --metadata .\vlm\data\safebooru_2d\japanese_anime_turnaround_pilot_20\metadata.jsonl
    --atomic-dir .\vlm\data\safebooru_2d\japanese_anime_turnaround_pilot_20\atomic_rules
    --report-dir .\vlm\data\safebooru_2d\japanese_anime_turnaround_pilot_20\reports
