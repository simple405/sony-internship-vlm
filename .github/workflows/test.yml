name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vlm/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r vlm/requirements-dev.txt
      - name: Run repository quality and secret checks
        env:
          SKIP: gitleaks,no-commit-to-branch
        run: python -m pre_commit run --all-files
      - name: Compile retained scripts
        run: python -m compileall -q vlm/scripts
      - name: Run tests
        run: python -m pytest -q
